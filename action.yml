name: 'Hypergryph Profile Cards'
description: 'Render your Arknights and Arknights: Endfield player data into a profile card, refreshed every day.'
author: 'FelixFan-CN'

branding:
  icon: 'credit-card'
  color: 'purple'

inputs:
  config:
    description: '配置文件路径（相对 root）'
    required: false
    default: 'profile-cards.yaml'
  root:
    description: '仓库根目录；底图、产物与配置都相对它解析'
    required: false
    default: ''
  assets-dir:
    description: '底图所在目录（相对 root）'
    required: false
    default: 'assets'
  output-dir:
    description: '产物输出目录；留空则沿用配置里的 output'
    required: false
    default: ''
  python-version:
    description: '使用的 Python 版本'
    required: false
    default: '3.12'
  only:
    description: '只渲染指定的卡片 id，逗号分隔'
    required: false
    default: ''
  strict:
    description: '任意一张卡失败就让本步骤失败'
    required: false
    default: 'false'
  cache-fonts:
    description: '缓存中文字体，避免每次都重新下载'
    required: false
    default: 'true'
  commit:
    description: '由本 Action 提交产物'
    required: false
    default: 'false'
  commit-message:
    description: '提交信息'
    required: false
    default: 'chore: update profile cards'
  commit-paths:
    description: 'git add 的路径；留空则使用 output-dir 或 assets-dir'
    required: false
    default: ''

outputs:
  produced:
    description: '成功生成的卡片路径（换行分隔）'
    value: ${{ steps.render.outputs.produced }}
  failed:
    description: '失败的卡片 id（换行分隔）'
    value: ${{ steps.render.outputs.failed }}
  skipped:
    description: '被跳过的卡片 id（换行分隔）'
    value: ${{ steps.render.outputs.skipped }}
  changed:
    description: '产物相对运行前是否发生变化'
    value: ${{ steps.render.outputs.changed }}
  summary:
    description: '一行结果摘要'
    value: ${{ steps.render.outputs.summary }}

runs:
  using: composite
  steps:
    - name: 准备 Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: 缓存中文字体
      if: inputs.cache-fonts == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/profile-cards-fonts
        key: profile-cards-fonts-noto-sc-subset-v1

    - name: 下载中文字体
      shell: bash
      env:
        FONT_DIR: ${{ runner.temp }}/profile-cards-fonts
      run: bash "${{ github.action_path }}/scripts/ensure_fonts.sh"

    - name: 安装 hypergryph-profile-cards
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "${{ github.action_path }}"

    - name: 生成名片
      id: render
      shell: bash
      env:
        PROFILE_CARDS_FONT_DIR: ${{ runner.temp }}/profile-cards-fonts
        PC_CONFIG: ${{ inputs.config }}
        PC_ROOT: ${{ inputs.root }}
        PC_ASSETS_DIR: ${{ inputs.assets-dir }}
        PC_OUTPUT_DIR: ${{ inputs.output-dir }}
        PC_ONLY: ${{ inputs.only }}
        PC_STRICT: ${{ inputs.strict }}
      run: python "${{ github.action_path }}/scripts/run_action.py"

    - name: 提交更新
      if: inputs.commit == 'true' && steps.render.outputs.changed == 'true'
      shell: bash
      env:
        PC_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        PC_COMMIT_PATHS: ${{ inputs.commit-paths }}
        PC_ASSETS_DIR: ${{ inputs.assets-dir }}
        PC_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: bash "${{ github.action_path }}/scripts/commit.sh"
